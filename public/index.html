<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MCSR Replayoffs</title>
    <!-- Styles and behaviour live in siblings rather than inline: this file grows a section per
     dashboard feature, and CLAUDE.md caps a file at 500 lines. Both are served by src/server.ts
     next to /index.html, so there is no bundler and no build step. -->
    <link rel="icon" href="/favicon.png" sizes="64x64" />
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/panels.css" />
  </head>
  <body>
    <header>
      <h1>MCSR <span class="dot">&#9679;</span> Replayoffs</h1>
      <!-- In the header rather than in a panel: starting a match is the whole reason for reaching
       this page from a phone, so it must not be behind a tab. -->
      <form class="entry" id="entry">
        <input
          type="text"
          id="entryinput"
          placeholder="Match ID or match page URL"
          aria-label="Match ID or match page URL"
        />
        <button type="submit" title="Render, encode the MP4 and let the model pick the Short's moment">
          Render
        </button>
      </form>
      <span class="err" id="entryerr"></span>
      <span class="meta" id="hostmeta"></span>
    </header>

    <!-- The nightly strip: what the clock will do tonight, what it did last time, and the two
     lines that must be read before anything else -- a failed run, a server one restart behind.
     Under the header rather than inside a tab so it is on every screen (app.js paintNightly). -->
    <div id="nightly" class="nightly"></div>

    <!-- The list and the match are two screens at every width; this is the way back on a phone
     or tablet (on a desktop the rail is), with the next match waiting for a hook beside it.
     Outside <main> so it can stick to the page rather than to its own grid row, and outside
     #detail because select() rewrites that whole subtree. -->
    <div id="backbar">
      <button type="button" id="backtolist"></button>
      <button type="button" id="nextwaiting" hidden></button>
    </div>

    <main>
      <!-- The only navigation: a fixed bottom bar up to 860px, a rail on a desktop. Each cell is
       the tab's name over its count (app.js writes the <small>). -->
      <nav class="tabs" role="tablist">
        <button id="tab-suggestions" role="tab" aria-selected="true">
          <span>Tonight</span><small></small>
        </button>
        <button id="tab-matches" role="tab" aria-selected="false">
          <span>Rendered</span><small></small>
        </button>
        <button id="tab-abtest" role="tab" aria-selected="false"><span>A/B</span><small></small></button>
        <button id="tab-settings" role="tab" aria-selected="false">
          <span>Settings</span><small></small>
        </button>
      </nav>
      <section id="left">
        <div id="suggestions"><div class="empty">Scanning&hellip;</div></div>
        <div id="list" hidden><div class="empty">Loading&hellip;</div></div>
        <div id="abtest" hidden><div class="empty">Loading&hellip;</div></div>
        <div id="settings" hidden><div class="empty">Loading&hellip;</div></div>
      </section>
      <section id="detail"><div class="empty">Pick a match, or paste an ID above.</div></section>
    </main>

    <!-- youtube.js first: it only declares functions, while app.js ends in the init IIFE that
     actually runs and calls into them. Both are classic scripts sharing one global scope. -->
    <script src="/splits.js"></script>
    <script src="/youtube.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
