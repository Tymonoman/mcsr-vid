<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MCSR Replayoffs</title>
    <!-- Styles and behaviour live in siblings rather than inline: this file grows a section per
     dashboard feature, and CLAUDE.md caps a file at 500 lines. Both are served by src/server.ts
     next to /index.html, so there is no bundler and no build step. -->
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/panels.css" />
  </head>
  <body>
    <header>
      <h1>MCSR <span class="dot">&#9679;</span> Replayoffs</h1>
      <!-- In the header rather than in a panel: starting a match is the whole reason for reaching
       this page from a phone, so it must not be behind a tab. -->
      <form class="entry" id="entry">
        <input
          type="text"
          id="entryinput"
          placeholder="Match ID or mcsrranked.com URL"
          aria-label="Match ID or mcsrranked.com URL"
        />
        <button type="submit">Render</button>
      </form>
      <span class="err" id="entryerr"></span>
      <span class="meta" id="hostmeta"></span>
    </header>

    <main>
      <section id="left">
        <div class="tabs" role="tablist">
          <button id="tab-suggestions" role="tab" aria-selected="true">Suggestions</button>
          <button id="tab-matches" role="tab" aria-selected="false">Rendered</button>
          <button id="tab-abtest" role="tab" aria-selected="false">A/B</button>
        </div>
        <div id="suggestions"><div class="empty">Scanning&hellip;</div></div>
        <div id="list" hidden><div class="empty">Loading&hellip;</div></div>
        <div id="abtest" hidden><div class="empty">Loading&hellip;</div></div>
      </section>
      <section id="detail"><div class="empty">Pick a match, or paste an ID above.</div></section>
    </main>

    <!-- youtube.js first: it only declares functions, while app.js ends in the init IIFE that
     actually runs and calls into them. Both are classic scripts sharing one global scope. -->
    <script src="/youtube.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
