name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # What test:unit shells out to: git (repoHead), python3 (hooks, watchPov: a fake
      # HOOK_SUGGEST_CMD and watch.py) — both on the runner image — and rsync (publishSet's pull
      # round-trip, which skips itself without it). No unit test runs ffmpeg or Chromium; the
      # two that do are `npm test`'s extra pair, not run here.
      - name: Install rsync
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends rsync

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # No secrets: with no mcsr-vid.config.json the defaults apply (mediaDir ./media,
      # reasonerCommand null), and every test stubs the MCSR, Twitch and YouTube calls.
      - name: Unit tests
        run: npm run test:unit
